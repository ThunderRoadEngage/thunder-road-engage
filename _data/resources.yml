# Resources page content.
# Each group becomes a section. Add a link by copying one "- title:" block.
#   title:       name of the course, book or organization
#   by:          (optional) author or publisher
#   description: one or two sentences on why it helps
#   kind:        (optional) short label, e.g. Course, Webinar, Book, Database
#   url:         full web address
#   phone:       (optional) a phone number; the entry is shown as a tip line

- id: tip-lines
  title: Anti-trafficking tip lines
  intro: Report suspected human trafficking to federal investigators. If someone is in immediate danger, call 911.
  links:
    - title: Homeland Security Tip Line
      by: U.S. Department of Homeland Security
      phone: "1-866-347-2423"
      description: Toll-free and open to callers in the U.S. and Canada. If you suspect human trafficking or child sex abuse material, call immediately.
      kind: Tip line
      url: https://www.ice.gov/tipline

- id: training
  title: Training and outreach
  intro: Organizations that train families, advocates and volunteers, and work to recover trafficked and missing children.
  links:
    - title: Association for the Recovery of Children
      description: Recovers missing, abducted and trafficked American children at no cost to custodial parents. Offers equipping courses and a training certification.
      kind: Paid Training
      url: https://recoveryofchildren.org
    - title: DHS Blue Campaign
      by: U.S. Department of Homeland Security
      description: The DHS Blue Campaign provides free training and public awareness regarding the 
      kind: Training
      url: https://www.dhs.gov/blue-campaign
    - title: Shared Hope International
      description: Works to prevent child sex trafficking, support survivors and strengthen the law, with education and training for communities.
      kind: Training
      url: https://sharedhope.org

